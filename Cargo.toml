[package]
name = "micro-rag"
version = "0.1.0"
edition = "2021"
authors = ["Abass le roi des Bobbys <systems@microrag.local>"]
description = "High-performance embedded vector engine, KD-Tree indexer, WAL storage, and LRU semantic cache."
license = "MIT"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
