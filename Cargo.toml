[package]
name = "micro-rag"
version = "0.1.0"
edition = "2021"
authors = ["Mohamed Taha Enasraoui"]
description = "In-memory vector index, semantic query cache, and write-ahead log for local RAG pipelines. Pure safe Rust, no vector-DB dependencies."
license = "MIT"
repository = "https://github.com/tahaenasraoui-debug/micro-rag"
readme = "README.md"
keywords = ["vector-search", "rag", "semantic-cache", "wal", "embeddings"]
categories = ["algorithms", "data-structures"]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
